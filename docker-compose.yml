services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auditlog}
      POSTGRES_USER: ${POSTGRES_USER:-auditlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditlog_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditlog}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
