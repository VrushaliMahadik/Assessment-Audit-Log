services:
  postgres:
    image: postgres:16
    # Development-only container. Production credentials must come from a secret manager.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set for local development}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set for local development}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditlog}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
