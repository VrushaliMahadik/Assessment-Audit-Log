spring.application.name=audit-log

# JWT Resource Server configuration
# Set JWT_JWK_SET_URI to your OAuth2 provider's JWK Set endpoint.
# The JWK set is fetched lazily (on first token validation), not at startup.
#
# Local development example (Keycloak):
#   export JWT_JWK_SET_URI=http://localhost:8080/realms/audit-realm/protocol/openid-connect/certs
#
# Production: inject via environment variable or secrets manager — never hardcode here.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:9090/protocol/openid-connect/certs}

# Database configuration
# Local development: start PostgreSQL with docker-compose up, then run the application.
# Production: inject SPRING_DATASOURCE_* via environment variables or secrets manager.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditlog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway — migrations run automatically on startup from classpath:db/migration
spring.flyway.enabled=true

# Scenario B retention configuration
# Default retention window: 30 days; scheduled nightly at 03:00
audit.retention.days=${AUDIT_RETENTION_DAYS:30}
audit.retention.cron=${AUDIT_RETENTION_CRON:0 0 3 * * *}
audit.export.max-records=${AUDIT_EXPORT_MAX_RECORDS:10000}
