# Test datasource — H2 in-memory for auth/security/context tests (no Docker required)
# Flyway is disabled here because the PostgreSQL migration SQL uses JSONB/BIGSERIAL
# which H2 does not support.  DatabaseMigrationIntegrationTest overrides both
# properties via @DynamicPropertySource + @TestPropertySource and uses Testcontainers.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
